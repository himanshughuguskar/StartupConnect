<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - StartupConnect</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1220;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-screen {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: #111827;
      border: 1px solid #263244;
      border-radius: 20px;
      padding: 42px 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .logo {
      text-decoration: none;
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 42px;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #2563eb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .auth-heading {
      font-size: 32px;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .auth-sub {
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .google-btn {
      width: 100%;
      min-height: 54px;
      border: 1px solid #374151;
      border-radius: 12px;
      background: #ffffff;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease,
                  box-shadow 0.15s ease,
                  opacity 0.15s ease;
    }

    .google-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .google-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .google-btn svg {
      flex-shrink: 0;
    }

    .auth-note {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      margin-top: 20px;
    }

    .message {
      min-height: 24px;
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #fca5a5;
      line-height: 1.5;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 28px;
      color: #93c5fd;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .security-box {
      margin-top: 30px;
      padding: 14px 16px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid #1e293b;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 500px) {
      .auth-card {
        padding: 32px 22px;
      }

      .auth-heading {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="auth-screen">

    <div class="auth-card">

      <a href="index.html" class="logo">
        <span class="logo-mark">S</span>
        <span>StartupConnect</span>
      </a>

      <h1 class="auth-heading">
        Welcome back
      </h1>

      <p class="auth-sub">
        Sign in to find your next startup or investor connection.
      </p>

      <button
        class="google-btn"
        id="googleLoginBtn"
        type="button"
      >

        <svg
          width="20"
          height="20"
          viewBox="0 0 48 48"
          aria-hidden="true"
        >

          <path
            fill="#FFC107"
            d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"
          />

          <path
            fill="#FF3D00"
            d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"
          />

          <path
            fill="#4CAF50"
            d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.3 35.5 26.8 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.6 39.6 16.2 44 24 44z"
          />

          <path
            fill="#1976D2"
            d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.5l6.3 5.3C40.9 36.2 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"
          />

        </svg>

        <span id="googleButtonText">
          Continue with Google
        </span>

      </button>

      <div
        id="message"
        class="message"
        aria-live="polite"
      ></div>

      <p class="auth-note">
        🔒 Secure authentication powered by Firebase
      </p>

      <div class="security-box">
        Your Google account is used only to authenticate
        your StartupConnect account.
      </div>

      <a
        href="index.html"
        class="back-link"
      >
        ← Back to StartupConnect
      </a>

    </div>

  </div>


  <!-- =====================================================
       FIREBASE AUTHENTICATION
       ===================================================== -->

  <script type="module">

    import {
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
      auth,
      googleProvider
    } from "./js/firebase.js";


    const googleLoginButton =
      document.getElementById("googleLoginBtn");

    const googleButtonText =
      document.getElementById("googleButtonText");

    const message =
      document.getElementById("message");


    /*
     * Google Login
     */
    async function loginWithGoogle() {

      try {

        googleLoginButton.disabled = true;

        googleButtonText.textContent =
          "Signing in...";

        message.textContent =
          "Opening Google sign-in...";


        const result =
          await signInWithPopup(
            auth,
            googleProvider
          );


        const user =
          result.user;


        /*
         * Firebase UID is the permanent identity
         * used by StartupConnect.
         */

        console.log(
          "Login successful"
        );

        console.log(
          "Firebase UID:",
          user.uid
        );

        console.log(
          "Name:",
          user.displayName
        );

        console.log(
          "Email:",
          user.email
        );


        /*
         * Save Firebase UID for the rest
         * of the StartupConnect application.
         *
         * profile.html already checks sc_userId.
         */

        localStorage.setItem(
          "sc_userId",
          user.uid
        );


        /*
         * Keep the existing StartupConnect
         * logged-in flag.
         */

        localStorage.setItem(
          "sc_isLoggedIn",
          "true"
        );


        /*
         * Store basic authenticated user information.
         * This does NOT replace the profile.
         * The actual Startup/Investor profile is
         * completed on profile.html.
         */

        const existingProfile =
          JSON.parse(
            localStorage.getItem(
              "sc_userProfile"
            ) || "null"
          );


        if (existingProfile) {

          /*
           * Make sure the existing profile uses
           * the Firebase UID rather than the old
           * browser-generated ID.
           */

          existingProfile.userId =
            user.uid;

          existingProfile.uid =
            user.uid;

          existingProfile.email =
            user.email || existingProfile.email;

          existingProfile.displayName =
            user.displayName ||
            existingProfile.displayName;

          localStorage.setItem(
            "sc_userProfile",
            JSON.stringify(existingProfile)
          );

        }


        /*
         * Continue the existing application flow.
         */

        if (existingProfile) {

          window.location.href =
            "dashboard.html";

        } else {

          window.location.href =
            "profile.html";

        }

      } catch (error) {

        console.error(
          "Google login failed:",
          error
        );


        googleLoginButton.disabled =
          false;

        googleButtonText.textContent =
          "Continue with Google";


        if (
          error.code ===
          "auth/popup-closed-by-user"
        ) {

          message.textContent =
            "Login popup was closed.";

        } else if (
          error.code ===
          "auth/popup-blocked"
        ) {

          message.textContent =
            "Your browser blocked the login popup. Please allow popups and try again.";

        } else {

          message.textContent =
            "Google login failed. Please try again.";

        }

      }

    }


    /*
     * Prevent logged-in users from seeing
     * the login screen again.
     */

    onAuthStateChanged(
      auth,
      (user) => {

        if (!user) {
          return;
        }


        console.log(
          "Authenticated Firebase user:",
          user.uid
        );


        /*
         * Keep the Firebase UID synchronized.
         */

        localStorage.setItem(
          "sc_userId",
          user.uid
        );

      }
    );


    /*
     * Connect the button.
     */

    googleLoginButton.addEventListener(
      "click",
      loginWithGoogle
    );

  </script>

</body>
</html>
