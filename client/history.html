<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connection History — StartupConnect</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap");
/* ===== style.css ===== */
/* =========================================================
   STARTUPCONNECT — GLOBAL DESIGN SYSTEM
   Theme: "Streaming Boardroom" — a Netflix-dark viewing
   experience re-tuned for a business/finance audience.
   Deep near-black backgrounds + a deep crimson primary
   (instead of Netflix's pure red) + a muted gold accent
   that signals "investment / money" rather than entertainment.
   ========================================================= */

:root {
  /* ---- Color tokens ---- */
  --bg: #0a0d12;             /* app background, near-black w/ cool tint */
  --bg-elevated: #0f131a;    /* slightly raised background (headers) */
  --surface: #141920;        /* cards, panels */
  --surface-2: #1b212b;      /* hover/active surface, inputs */
  --border: #262d38;
  --border-soft: #1e2530;

  --text: #edeff2;
  --text-muted: #8b93a1;
  --text-faint: #5b6472;

  --primary: #b3121e;        /* deep business crimson, not Netflix-red */
  --primary-hover: #8f0e18;
  --primary-soft: rgba(179, 18, 30, 0.14);

  --gold: #c9a24b;           /* "investor / capital" accent */
  --gold-hover: #b38f3f;
  --gold-soft: rgba(201, 162, 75, 0.14);

  --success: #2ecc71;
  --success-soft: rgba(46, 204, 113, 0.14);
  --danger: #e5484d;

  /* ---- Typography ---- */
  --font-display: "Space Grotesk", "Segoe UI", sans-serif;
  --font-body: "Inter", "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", monospace;

  /* ---- Spacing scale ---- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  /* ---- Radius / shadow ---- */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
  --shadow-glow: 0 0 0 1px rgba(179, 18, 30, 0.35), 0 8px 30px rgba(179, 18, 30, 0.18);

  --transition: 180ms ease;
  --max-width: 1200px;
}



* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

img {
  max-width: 100%;
  display: block;
}

a {
  color: inherit;
  text-decoration: none;
}

ul {
  list-style: none;
}

button {
  font-family: inherit;
  cursor: pointer;
}

input,
textarea,
select {
  font-family: inherit;
  color: var(--text);
}

:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

.container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--space-5);
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.15;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
}

/* =========================================================
   NAVBAR — shared across every page
   ========================================================= */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 13, 18, 0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-soft);
}

.navbar .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
}

.logo {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
}

.logo .logo-mark {
  color: var(--primary);
}

.nav-links {
  display: flex;
  gap: var(--space-6);
  align-items: center;
}

.nav-links a {
  font-size: 0.9rem;
  color: var(--text-muted);
  transition: color var(--transition);
}

.nav-links a:hover {
  color: var(--text);
}

.nav-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  font-size: 1.5rem;
}

/* =========================================================
   BUTTONS
   ========================================================= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: 0.85rem 1.6rem;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: 0.95rem;
  font-weight: 600;
  transition: transform var(--transition), background var(--transition), border-color var(--transition), box-shadow var(--transition);
  white-space: nowrap;
}

.btn:active {
  transform: scale(0.98);
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--primary-hover);
  box-shadow: var(--shadow-glow);
}

.btn-gold {
  background: var(--gold);
  color: #12161c;
}

.btn-gold:hover {
  background: var(--gold-hover);
}

.btn-secondary {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border);
}

.btn-secondary:hover {
  border-color: var(--text-faint);
}

.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  border-color: var(--border);
}

.btn-ghost:hover {
  color: var(--text);
  border-color: var(--text-faint);
}

.btn-danger {
  background: transparent;
  color: var(--danger);
  border-color: rgba(229, 72, 77, 0.4);
}

.btn-danger:hover {
  background: rgba(229, 72, 77, 0.1);
}

.btn-block {
  width: 100%;
}

.btn-lg {
  padding: 1.1rem 2rem;
  font-size: 1.05rem;
}

/* =========================================================
   CARDS
   ========================================================= */
.card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: var(--space-5);
  box-shadow: var(--shadow-sm);
}

/* =========================================================
   FORM ELEMENTS
   ========================================================= */
.field {
  margin-bottom: var(--space-5);
}

.field label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: var(--space-2);
  color: var(--text-muted);
}

.field input,
.field select,
.field textarea {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.8rem 1rem;
  font-size: 0.95rem;
  transition: border-color var(--transition);
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--gold);
}

.field textarea {
  resize: vertical;
  min-height: 100px;
}

.field-error {
  display: none;
  color: var(--danger);
  font-size: 0.8rem;
  margin-top: var(--space-1);
}

.field.has-error input,
.field.has-error textarea,
.field.has-error select {
  border-color: var(--danger);
}

.field.has-error .field-error {
  display: block;
}

/* =========================================================
   TICKER — signature element
   A scrolling stock-ticker style strip: Netflix's "always
   something playing" energy, expressed as market data.
   ========================================================= */
.ticker {
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border-soft);
  overflow: hidden;
  white-space: nowrap;
  padding: var(--space-2) 0;
}

.ticker-track {
  display: inline-flex;
  gap: var(--space-7);
  animation: ticker-scroll 28s linear infinite;
  padding-left: 100%;
}

.ticker-track span {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text-muted);
}

.ticker-track span strong {
  color: var(--gold);
  font-weight: 500;
}

@keyframes ticker-scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}

@media (prefers-reduced-motion: reduce) {
  .ticker-track {
    animation: none;
  }
}

/* =========================================================
   LANDING PAGE (index.html)
   ========================================================= */
.hero {
  padding: var(--space-8) 0 var(--space-7);
  border-bottom: 1px solid var(--border-soft);
  background:
    radial-gradient(ellipse 60% 50% at 50% 0%, var(--primary-soft), transparent 70%);
}

.hero-inner {
  max-width: 760px;
  text-align: center;
  margin: 0 auto;
}

.hero h1 {
  font-size: clamp(2.4rem, 5vw, 4rem);
  margin: var(--space-4) 0 var(--space-5);
}

.hero-sub {
  color: var(--text-muted);
  font-size: 1.1rem;
  max-width: 560px;
  margin: 0 auto var(--space-6);
}

.hero-actions {
  display: flex;
  gap: var(--space-4);
  justify-content: center;
  flex-wrap: wrap;
}

.section-title {
  font-size: clamp(1.6rem, 3vw, 2.2rem);
  margin: var(--space-3) 0 var(--space-6);
}

.features {
  padding: var(--space-8) 0;
}

.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-5);
}

.feature-card {
  transition: transform var(--transition), border-color var(--transition);
}

.feature-card:hover {
  transform: translateY(-4px);
  border-color: var(--primary);
}

.feature-icon {
  font-size: 1.8rem;
  margin-bottom: var(--space-3);
}

.feature-card h3 {
  margin-bottom: var(--space-2);
  font-size: 1.15rem;
}

.feature-card p {
  color: var(--text-muted);
  font-size: 0.95rem;
}

.how-it-works {
  padding: var(--space-8) 0;
  background: var(--bg-elevated);
  border-top: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
}

.steps-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-5);
}

.step-num {
  display: block;
  font-family: var(--font-mono);
  color: var(--gold);
  font-size: 0.85rem;
  margin-bottom: var(--space-2);
}

.step h4 {
  margin-bottom: var(--space-2);
  font-size: 1.05rem;
}

.step p {
  color: var(--text-muted);
  font-size: 0.9rem;
}

@media (max-width: 900px) {
  .feature-grid { grid-template-columns: 1fr; }
  .steps-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 480px) {
  .steps-grid { grid-template-columns: 1fr; }
}

/* =========================================================
   FOOTER
   ========================================================= */
.site-footer {
  border-top: 1px solid var(--border-soft);
  padding: var(--space-7) 0 var(--space-6);
  margin-top: var(--space-8);
}

.site-footer .container {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
}

.footer-note {
  color: var(--text-faint);
  font-size: 0.85rem;
  font-family: var(--font-mono);
}

/* =========================================================
   MODAL (shared)
   ========================================================= */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(4, 5, 7, 0.72);
  backdrop-filter: blur(3px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: var(--space-4);
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-6);
  max-width: 420px;
  width: 100%;
  box-shadow: var(--shadow-md);
  animation: modal-in 200ms ease;
}

@keyframes modal-in {
  from { opacity: 0; transform: translateY(8px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal h3 {
  margin-bottom: var(--space-3);
}

.modal p {
  color: var(--text-muted);
  margin-bottom: var(--space-5);
  font-size: 0.95rem;
}

.modal-actions {
  display: flex;
  gap: var(--space-3);
  justify-content: flex-end;
}

.modal-actions .btn {
  flex: 1;
}

/* Utility */
.text-center { text-align: center; }
.mt-2 { margin-top: var(--space-4); }
.mt-4 { margin-top: var(--space-6); }
.hidden { display: none !important; }

@media (max-width: 768px) {
  .nav-links {
    position: fixed;
    top: 72px;
    left: 0;
    right: 0;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border-soft);
    flex-direction: column;
    align-items: flex-start;
    padding: var(--space-5);
    gap: var(--space-4);
    transform: translateY(-150%);
    transition: transform var(--transition);
  }

  .nav-links.open {
    transform: translateY(0);
  }

  .nav-toggle {
    display: block;
  }
}


/* ===== history.css ===== */
/* =========================================================
   history.css
   ========================================================= */

.history-page {
  padding: var(--space-6) var(--space-5) var(--space-8);
}

.history-head {
  margin-bottom: var(--space-6);
}

.history-head h1 {
  font-size: 1.9rem;
  margin: var(--space-2) 0;
}

.history-sub {
  color: var(--text-muted);
}

.history-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-4);
}

.history-empty {
  grid-column: 1 / -1;
  border: 1px dashed var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-8);
  text-align: center;
  color: var(--text-faint);
}

.history-card {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-4);
  transition: border-color var(--transition);
}

.history-card:hover {
  border-color: var(--gold);
}

.history-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--gold));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  flex-shrink: 0;
}

.history-info {
  flex: 1;
  min-width: 0;
}

.history-name {
  font-weight: 600;
}

.history-meta {
  color: var(--text-muted);
  font-size: 0.85rem;
}

.history-date {
  color: var(--text-faint);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  margin-top: var(--space-1);
}

.contact-status {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  padding: 0.2rem 0.6rem;
  border-radius: 999px;
  white-space: nowrap;
}

.contact-status.shared {
  background: var(--success-soft);
  color: var(--success);
}

.contact-status.not-shared {
  background: var(--surface-2);
  color: var(--text-faint);
}

.history-card-footer {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--space-2);
}

@media (max-width: 700px) {
  .history-grid {
    grid-template-columns: 1fr;
  }
}

</style>
</head>
<body>

  <!-- ============ NAVBAR ============ -->
  <header class="navbar">
    <div class="container">
      <a href="dashboard.html" class="logo">
        <span class="logo-mark">●</span> StartupConnect
      </a>
      <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="history.html">History</a>
        <a href="profile.html">Edit Profile</a>
        <button class="btn btn-ghost" onclick="logout()">Logout</button>
      </nav>
      <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
    </div>
  </header>

  <main class="container history-page">
    <div class="history-head">
      <p class="eyebrow">Your network</p>
      <h1>Connection History</h1>
      <p class="history-sub">Everyone you've been matched with so far.</p>
    </div>

    <div class="history-grid" id="historyGrid">
      <!-- populated by history.js from mock data -->
    </div>
  </main>

<script>
/* ===== main.js ===== */
/* =========================================================
   main.js
   Shared utilities loaded on every page: mobile nav toggle,
   localStorage helpers, and shared mock data used by other
   JS files (profile.js, dashboard.js, chat.js, etc).
   ========================================================= */

// ---- Mobile nav toggle (used on any page that has a .nav-toggle) ----
function initNavToggle() {
  const toggle = document.querySelector(".nav-toggle");
  const links = document.querySelector(".nav-links");
  if (!toggle || !links) return;

  toggle.addEventListener("click", () => {
    links.classList.toggle("open");
  });
}

document.addEventListener("DOMContentLoaded", initNavToggle);

/* ---------------------------------------------------------
   localStorage helpers
   These are simple wrappers so the whole team uses the same
   storage keys. Once a real backend exists, these functions
   can be swapped for API calls without touching every page.
--------------------------------------------------------- */
const STORAGE_KEYS = {
  isLoggedIn: "sc_isLoggedIn",
  userProfile: "sc_userProfile",
  chatMessages: "sc_chatMessages",
  currentMatch: "sc_currentMatch",
  connectionHistory: "sc_connectionHistory",
};

function scGet(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    console.warn("Could not read from localStorage:", key, e);
    return null;
  }
}

function scSet(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function scRemove(key) {
  localStorage.removeItem(key);
}

/* ---------------------------------------------------------
   NOTE ON DATA: this frontend does not invent or display any
   fabricated user profiles, names, or statistics. Anywhere the
   app currently has no real backend connection, it shows a
   genuine empty state or a clearly-labeled "pending backend
   integration" placeholder instead of fake sample content.
--------------------------------------------------------- */

/**
 * getSimulatedMatch()
 * INTEGRATION POINT: Matchmaking API / Socket.IO
 *
 * There is no real matchmaking backend yet, so this returns a
 * single neutral placeholder object (not an invented person) so
 * the matching → chat flow can still be demonstrated end to end.
 * Replace this entirely once the backend emits a real match:
 *
 *   socket.on("match-found", (matchData) => { ... use matchData ... });
 */
function getSimulatedMatch() {
  const myProfile = scGet(STORAGE_KEYS.userProfile);
  const otherRole = myProfile?.role === "Investor" ? "Startup" : "Investor";

  return {
    name: `${otherRole} (pending backend integration)`,
    role: otherRole,
    focus: "Not yet connected to a real matchmaking backend",
    initials: otherRole === "Startup" ? "SU" : "IN",
  };
}

/**
 * recordConnectionHistory(match, contactShared)
 * Genuinely stores a record of a completed chat session in this
 * browser's localStorage — no invented names or dates. This is
 * real client-side history, just not yet synced to a database.
 * INTEGRATION POINT: write this record to Firestore / an API
 * instead of (or in addition to) localStorage once available.
 */
function recordConnectionHistory(match, contactShared) {
  const history = scGet(STORAGE_KEYS.connectionHistory) || [];
  history.unshift({
    name: match.name,
    role: match.role,
    date: new Date().toLocaleDateString(undefined, { month: "short", day: "2-digit", year: "numeric" }),
    contactShared: !!contactShared,
    initials: match.initials,
  });
  scSet(STORAGE_KEYS.connectionHistory, history);
}

/**
 * logout()
 * INTEGRATION POINT: Firebase Authentication (sign out)
 * Shared across every page that has a Logout button.
 */
function logout() {
  scRemove(STORAGE_KEYS.isLoggedIn);
  window.location.href = "index.html";
}


/* ===== history.js ===== */
/* =========================================================
   history.js
   Renders the real connection history stored in this browser's
   localStorage (built up as the user finishes chats).
   INTEGRATION POINT: a real backend would fetch this list
   from Firestore / an API instead of localStorage.
   ========================================================= */

document.addEventListener("DOMContentLoaded", renderHistory);

function renderHistory() {
  const grid = document.getElementById("historyGrid");
  const history = scGet(STORAGE_KEYS.connectionHistory) || [];

  if (history.length === 0) {
    grid.innerHTML = `
      <div class="history-empty">
        <p>No connections yet. Once you finish a chat, it'll show up here.</p>
      </div>`;
    return;
  }

  grid.innerHTML = history.map(
    (person) => `
    <div class="card history-card">
      <div class="history-avatar">${person.initials}</div>
      <div class="history-info">
        <div class="history-name">${person.name}</div>
        <div class="history-meta">${person.role}</div>
        <div class="history-date">${person.date}</div>
      </div>
      <div class="history-card-footer">
        <span class="contact-status ${person.contactShared ? "shared" : "not-shared"}">
          ${person.contactShared ? "Contact shared" : "Not shared"}
        </span>
        <button class="btn btn-secondary" onclick="viewProfile('${person.name}')">View Profile</button>
      </div>
    </div>`
  ).join("");
}

function viewProfile(name) {
  // INTEGRATION POINT: link to a real profile view once backend exists
  alert(`Viewing ${name}'s profile — this will open a full profile page once connected to the backend.`);
}

</script>
</body>
</html>
